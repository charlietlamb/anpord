name: Deploy worker

# What the worker's own bundle contains. The eval package is most of it: the
# worker is a thin task around the grid, so a change there is a change to what
# actually runs a trial.
on:
  push:
    branches: [main]
    paths:
      - "apps/worker/**"
      - "packages/db/**"
      - "packages/eval/**"
      - "packages/ids/**"
      - "packages/schema/**"
      - "bun.lock"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Trigger's cli builds the task with node, not bun.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      # An access token, not the environment secret key the server runs with:
      # tr_prod_sk_ triggers runs, and creating a version is a different right
      # the cli refuses it for. Either prefix the cli accepts works, and an
      # organization token is the one to prefer -- it belongs to the org rather
      # than to whoever created it, so the deploy survives them leaving.
      - name: Deploy the eval worker
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
        run: |
          case "$TRIGGER_ACCESS_TOKEN" in
            tr_oat_*|tr_pat_*) ;;
            "")
              echo "TRIGGER_ACCESS_TOKEN is not set. Add an organization access"
              echo "token (tr_oat_, from Organization settings) or a personal one"
              echo "(tr_pat_) to the repository secrets."
              exit 1 ;;
            *)
              echo "TRIGGER_ACCESS_TOKEN is not an access token: the cli takes"
              echo "tr_oat_ or tr_pat_, not an environment secret key."
              exit 1 ;;
          esac
          bunx trigger.dev@4.5.15 deploy
        working-directory: apps/worker
