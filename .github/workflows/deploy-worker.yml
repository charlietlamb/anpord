name: Deploy worker

# What the worker's own bundle contains. The eval package is most of it: the
# worker is a thin task around the grid, so a change there is a change to what
# actually runs a trial.
on:
  push:
    branches: [main]
    paths:
      - "apps/worker/**"
      - "packages/db/**"
      - "packages/eval/**"
      - "packages/ids/**"
      - "packages/schema/**"
      - "bun.lock"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Trigger's cli builds the task with node, not bun.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      # The worker reads the same rows the server writes, so it reads them from
      # the same place. Set by hand once, it pointed at a database the server
      # had already moved off, and every run died on the old project's quota
      # with nothing on the run to say so.
      - name: Point the worker at the server's database
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
        run: |
          PROJECT="$(grep -oE 'proj_[a-z0-9]+' apps/worker/trigger.config.ts | head -1)"
          DB="$(aws secretsmanager get-secret-value \
            --secret-id anpord/server/DATABASE_URL \
            --query SecretString --output text)"
          curl -sf -X PUT \
            -H "Authorization: Bearer $TRIGGER_ACCESS_TOKEN" \
            -H "content-type: application/json" \
            --data-binary "$(node -p 'JSON.stringify({ value: process.argv[1] })' "$DB")" \
            "https://api.trigger.dev/api/v1/projects/$PROJECT/envvars/prod/DATABASE_URL" \
            > /dev/null
          echo "worker database set from anpord/server/DATABASE_URL"

      # An access token, not the environment secret key the server runs with:
      # tr_prod_sk_ triggers runs, and creating a version is a different right
      # the cli refuses it for. Either prefix the cli accepts works, and an
      # organization token is the one to prefer -- it belongs to the org rather
      # than to whoever created it, so the deploy survives them leaving.
      - name: Deploy the eval worker
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
        run: |
          case "$TRIGGER_ACCESS_TOKEN" in
            tr_oat_*|tr_pat_*) ;;
            "")
              echo "TRIGGER_ACCESS_TOKEN is not set. Add an organization access"
              echo "token (tr_oat_, from Organization settings) or a personal one"
              echo "(tr_pat_) to the repository secrets."
              exit 1 ;;
            *)
              echo "TRIGGER_ACCESS_TOKEN is not an access token: the cli takes"
              echo "tr_oat_ or tr_pat_, not an environment secret key."
              exit 1 ;;
          esac
          bunx trigger.dev@4.5.15 deploy
        working-directory: apps/worker
