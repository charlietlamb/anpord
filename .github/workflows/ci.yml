name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The suite drives the real server binary against a real database, so it
  # catches what unit tests cannot: routing, authentication, encoding, and the
  # migrations applying from nothing. It owns its own cluster rather than using
  # a service container, which is also how it runs on a laptop.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # The SDK resolves to its build output, and the CLI scenarios run the
      # published entry point, so both need a build to have run.
      - run: bun run build

      # The runner ships the server binaries but leaves only the client tools on
      # PATH, so the harness is told where the rest live. Resolved here rather
      # than guessed at a version, which changes with the image.
      - name: Locate the postgres server binaries
        run: |
          bin=$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null | sort -V | tail -1)
          if [ -z "$bin" ] || [ ! -x "$bin/initdb" ]; then
            echo "No postgres server binaries on this image"
            exit 1
          fi
          echo "PGBIN=$bin" >> "$GITHUB_ENV"

      - name: Run the end-to-end scenarios
        run: bun run e2e

  check:
    runs-on: ubuntu-latest
    # The unit suite's database-backed tests skip without a database, and
    # skipped silently for months. EVAL_REQUIRE_DATABASE turns that skip into
    # a failure, and the service below gives them somewhere to run.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: anpord_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 10
          --health-timeout 5s
    env:
      EVAL_REQUIRE_DATABASE: "1"
      EVAL_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/anpord_test
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # The route tree and the SDK's entry points are generated, so both the
      # linter's import resolution and typecheck need a build to have run.
      - run: bun run build

      # The real journal, so a migration that cannot apply from nothing fails
      # here rather than by hand against production.
      - name: Migrate the test database
        run: bun run db:migrate
        env:
          DATABASE_URL: ${{ env.EVAL_TEST_DATABASE_URL }}

      - run: bun run check
      - run: bun run typecheck
      - run: bun run test
      - run: bun run knip

      # The spec is what the reference documentation and third-party clients are
      # built from, so it has to keep describing the API the code serves.
      - name: Verify the committed OpenAPI spec matches the code
        run: |
          bun run openapi
          if ! git diff --exit-code --stat apps/docs/openapi.json; then
            echo "apps/docs/openapi.json is stale. Run 'bun run openapi' and commit the result."
            exit 1
          fi

      # `catalog:` is a workspace protocol npm cannot install, so a published
      # package has to name real versions. They are checked against the catalog
      # rather than merely being concrete, which is what stops the published
      # package drifting from what the workspace builds against.
      - name: Verify the SDK depends on the catalog's versions
        run: |
          node -e "
            const root = require('./package.json').catalog ?? {};
            const sdk = require('./packages/sdk/package.json');
            let wrong = 0;
            for (const [name, specifier] of Object.entries(sdk.dependencies ?? {})) {
              const expected = root[name];
              if (expected === undefined) continue;
              if (specifier !== '^' + expected) {
                console.error(name + ' is ' + specifier + ', catalog says ^' + expected);
                wrong = 1;
              }
            }
            process.exit(wrong);
          "

      # A frozen install resolves the whole workspace, so a manifest the image
      # never copies fails the build rather than the package that omitted it.
      - name: Verify the server image copies every workspace manifest
        run: |
          missing=0
          for manifest in apps/*/package.json packages/*/package.json; do
            if ! grep -qF "COPY ${manifest} " apps/server/Dockerfile; then
              echo "apps/server/Dockerfile does not copy ${manifest}"
              missing=1
            fi
          done
          exit "$missing"

      # Copying a manifest only installs the package's dependencies in the build
      # stage. A workspace member the server imports whose node_modules never
      # reaches the release stage builds and pushes cleanly, then fails at
      # startup on a missing package and rolls the deployment back.
      - name: Verify the server image copies the node_modules it depends on
        run: |
          missing=0
          for package in $(node scripts/server-workspace-deps.mjs); do
            if ! grep -qF "/app/${package}/node_modules " apps/server/Dockerfile; then
              echo "apps/server/Dockerfile does not copy ${package}/node_modules"
              missing=1
            fi
          done
          exit "$missing"
