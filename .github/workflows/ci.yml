name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # The route tree and the SDK's entry points are generated, so both the
      # linter's import resolution and typecheck need a build to have run.
      - run: bun run build

      - run: bun run check
      - run: bun run typecheck
      - run: bun run test
      - run: bun run knip

      # The spec is what documentation and third-party clients are built from,
      # so it has to keep describing the API the code actually serves. The build
      # above regenerates the reference pages from it, so a new endpoint that
      # nobody documented shows up here as an uncommitted page.
      - name: Verify the committed OpenAPI spec and reference pages match the code
        run: |
          bun run openapi
          if ! git diff --exit-code --stat openapi.json apps/docs/api-reference; then
            echo "Run 'bun run openapi && bun run build' and commit the result."
            exit 1
          fi
          if [ -n "$(git status --porcelain apps/docs/api-reference)" ]; then
            git status --short apps/docs/api-reference
            echo "An endpoint has no reference page. Run 'bun run build' and commit it."
            exit 1
          fi
