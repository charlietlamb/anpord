name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # The route tree and the SDK's entry points are generated, so both the
      # linter's import resolution and typecheck need a build to have run.
      - run: bun run build

      - run: bun run check
      - run: bun run typecheck
      - run: bun run test
      - run: bun run knip
