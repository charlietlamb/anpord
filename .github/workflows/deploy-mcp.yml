name: Deploy MCP

on:
  push:
    branches: [main]
    paths:
      - "apps/mcp/**"
      - "packages/sdk/**"
      - "packages/schema/**"
      - "bun.lock"
      - ".github/workflows/deploy-mcp.yml"
  workflow_dispatch:

concurrency:
  group: deploy-mcp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      - name: Bundle
        run: |
          cd packages/sdk && bun run build
          cd ../../apps/mcp && bun run bundle

      - name: Authenticate
        env:
          MANUFACT_API_KEY: ${{ secrets.MANUFACT_API_KEY }}
          MANUFACT_ORG: ${{ secrets.MANUFACT_ORG }}
        run: |
          npm install -g @mcp-use/cli@4.1.4
          mcp-use login --api-key "$MANUFACT_API_KEY" --org "$MANUFACT_ORG" --no-open --json

      # The upload is a standalone bundle rather than this repository: Manufact
      # generates its own Dockerfile and installs with npm, which cannot resolve
      # the workspace protocol every manifest here uses.
      - name: Deploy
        env:
          ANPORD_API_URL: ${{ vars.ANPORD_API_URL }}
          ANPORD_AUTH_URL: ${{ vars.ANPORD_AUTH_URL }}
          MCP_RESOURCE_URL: ${{ vars.MCP_RESOURCE_URL }}
        run: |
          cd apps/mcp/dist
          {
            echo "ANPORD_BASE_URL=${ANPORD_API_URL:-https://api.anpord.com}"
            echo "ANPORD_AUTH_URL=${ANPORD_AUTH_URL:-https://www.anpord.com/api/auth}"
            echo "MCP_RESOURCE_URL=${MCP_RESOURCE_URL:-https://mcp.anpord.com/mcp}"
          } > .env.deploy
          mcp-use deploy . --no-github --name anpord-mcp --env-file .env.deploy --yes

      # A server that answers an anonymous request is one that lost its OAuth
      # configuration, which is worth failing the deploy over.
      - name: Verify the deployment refuses anonymous callers
        run: |
          url="$(mcp-use servers list --json | node -e "
            const data = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            const server = data.items.find((item) => item.name === 'anpord-mcp');
            process.stdout.write(server.mcpUrl);
          ")"
          echo "verifying $url"
          for attempt in $(seq 1 20); do
            status="$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$url" || true)"
            echo "attempt $attempt: $status"
            case "$status" in
              401) echo "refuses anonymous callers"; exit 0 ;;
              200|204) echo "served an anonymous caller"; exit 1 ;;
            esac
            sleep 15
          done
          echo "never became reachable"
          exit 1
