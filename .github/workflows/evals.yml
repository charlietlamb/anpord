name: Agent evals

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-evals-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  evals:
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    name: Anpord evals (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        suite: [sdk, mcp, cli, api]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/sdk build
      - uses: ./.github/actions/eval
        id: eval
        with:
          api-key: ${{ secrets.ANPORD_API_KEY }}
          working-directory: apps/e2e
          file: src/evals/${{ matrix.suite }}.eval.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.eval.outputs.report != ''
        with:
          name: anpord-${{ matrix.suite }}-${{ github.run_attempt }}
          path: ${{ steps.eval.outputs.report }}
          if-no-files-found: ignore
          retention-days: 7

  untrusted:
    if: >-
      github.event_name == 'pull_request' &&
      (github.actor == 'dependabot[bot]' ||
       github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Remote evals require trusted code and an Anpord API key. Unit tests still run without secrets.' >> "$GITHUB_STEP_SUMMARY"
