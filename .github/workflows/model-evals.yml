name: Model comparisons

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Start with claude-smoke to verify the Anthropic connection
        type: choice
        options: [claude-smoke, claude, codex]
        default: claude-smoke
        required: true

permissions:
  contents: read

concurrency:
  group: model-comparisons
  cancel-in-progress: false

jobs:
  compare:
    name: Model evals (${{ inputs.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/sdk build
      - uses: ./.github/actions/eval
        id: eval
        with:
          api-key: ${{ secrets.ANPORD_API_KEY }}
          working-directory: apps/e2e
          file: src/evals/comparison/${{ inputs.suite }}.eval.ts
          timeout: '3300'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.eval.outputs.report != ''
        with:
          name: model-comparison-${{ inputs.suite }}-${{ github.run_attempt }}
          path: ${{ steps.eval.outputs.report }}
          if-no-files-found: ignore
          retention-days: 7
