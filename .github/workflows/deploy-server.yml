name: Deploy server

# Only what the image actually contains. The web app deploys itself through
# Vercel, so a frontend-only change should not rebuild a container.
on:
  push:
    branches: [main]
    paths:
      - "apps/server/**"
      - "packages/auth/**"
      - "packages/cache/**"
      - "packages/db/**"
      - "packages/eval/**"
      - "packages/ids/**"
      - "packages/prompts/**"
      - "packages/schema/**"
      - "bun.lock"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  ECR_REPO: anpord-server
  APPRUNNER_SERVICE: anpord-server

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # The auth server mints MCP tokens for whatever this names, so leaving it
      # unset issues tokens for localhost that the MCP server then rejects. It
      # is merged into the existing environment rather than written over it,
      # because update-service replaces the whole map and would otherwise drop
      # the database URL and every secret alongside it.
      - name: Set MCP_RESOURCE_URL on the service
        env:
          MCP_RESOURCE_URL: ${{ vars.MCP_RESOURCE_URL }}
        run: |
          ARN="$(aws apprunner list-services --region "$AWS_REGION" \
            --query "ServiceSummaryList[?ServiceName=='$APPRUNNER_SERVICE'].ServiceArn | [0]" \
            --output text)"
          if [ "$ARN" = "None" ] || [ -z "$ARN" ]; then
            echo "No service named $APPRUNNER_SERVICE; create it first (see DEPLOY.md)."
            exit 1
          fi

          WANTED="${MCP_RESOURCE_URL:-https://mcp.anpord.com/mcp}"

          aws apprunner describe-service --service-arn "$ARN" --region "$AWS_REGION" \
            --query 'Service.SourceConfiguration' --output json > /tmp/source-current.json

          # The whole ImageRepository block is carried over untouched apart from
          # the one variable, so Port, StartCommand and the secret references
          # survive an update that would otherwise replace them wholesale.
          MCP_RESOURCE_URL="$WANTED" node -e "
            const fs = require('node:fs');
            const source = JSON.parse(fs.readFileSync('/tmp/source-current.json', 'utf8'));
            const repository = source.ImageRepository;
            if (!repository) {
              console.error('Service is not image-based; refusing to rewrite its source.');
              process.exit(1);
            }
            const image = repository.ImageConfiguration ?? {};
            const env = image.RuntimeEnvironmentVariables ?? {};
            const secrets = image.RuntimeEnvironmentSecrets ?? {};
            if (![env.TRIGGER_SECRET_KEY, env.TRIGGER_API_KEY,
                  secrets.TRIGGER_SECRET_KEY, secrets.TRIGGER_API_KEY].some(Boolean)) {
              console.error('Configure the production Trigger key in App Runner before deploying. See DEPLOY.md.');
              process.exit(1);
            }
            if (env.MCP_RESOURCE_URL === process.env.MCP_RESOURCE_URL) {
              fs.writeFileSync('/tmp/unchanged', '');
              process.exit(0);
            }
            fs.writeFileSync('/tmp/source.json', JSON.stringify({
              ImageRepository: {
                ...repository,
                ImageConfiguration: {
                  ...image,
                  RuntimeEnvironmentVariables: {
                    ...env,
                    MCP_RESOURCE_URL: process.env.MCP_RESOURCE_URL,
                  },
                },
              },
              AutoDeploymentsEnabled: source.AutoDeploymentsEnabled ?? false,
            }));
          "

          if [ -f /tmp/unchanged ]; then
            echo "MCP_RESOURCE_URL already set to $WANTED"
            exit 0
          fi

          aws apprunner update-service --service-arn "$ARN" --region "$AWS_REGION" \
            --source-configuration file:///tmp/source.json >/dev/null
          echo "Set MCP_RESOURCE_URL=$WANTED"

          # update-service is asynchronous and start-deployment is rejected while
          # the service is still updating, so the next step has to wait.
          for _ in $(seq 1 40); do
            STATUS="$(aws apprunner describe-service --service-arn "$ARN" \
              --region "$AWS_REGION" --query 'Service.Status' --output text)"
            [ "$STATUS" = "RUNNING" ] && break
            echo "waiting for update: $STATUS"
            sleep 15
          done

      - name: Hold the service's size, scaling and health check
        env:
          CPU: "512"
          MEMORY: "1024"
          MIN_INSTANCES: "2"
          MAX_INSTANCES: "4"
          MAX_CONCURRENCY: "80"
        run: |
          ARN="$(aws apprunner list-services --region "$AWS_REGION" \
            --query "ServiceSummaryList[?ServiceName=='$APPRUNNER_SERVICE'].ServiceArn | [0]" \
            --output text)"

          SCALING="$(aws apprunner list-auto-scaling-configurations --region "$AWS_REGION" \
            --auto-scaling-configuration-name "$APPRUNNER_SERVICE" --latest-only \
            --query 'AutoScalingConfigurationSummaryList[0].AutoScalingConfigurationArn' --output text)"
          SHAPE="$(aws apprunner describe-auto-scaling-configuration --region "$AWS_REGION" \
            --auto-scaling-configuration-arn "$SCALING" \
            --query 'AutoScalingConfiguration.[MinSize,MaxSize,MaxConcurrency]' --output text 2>/dev/null || true)"
          if [ "$SHAPE" != "$(printf '%s\t%s\t%s' "$MIN_INSTANCES" "$MAX_INSTANCES" "$MAX_CONCURRENCY")" ]; then
            SCALING="$(aws apprunner create-auto-scaling-configuration --region "$AWS_REGION" \
              --auto-scaling-configuration-name "$APPRUNNER_SERVICE" \
              --min-size "$MIN_INSTANCES" --max-size "$MAX_INSTANCES" --max-concurrency "$MAX_CONCURRENCY" \
              --query 'AutoScalingConfiguration.AutoScalingConfigurationArn' --output text)"
          fi

          CURRENT="$(aws apprunner describe-service --service-arn "$ARN" --region "$AWS_REGION" \
            --query 'Service.[InstanceConfiguration.Cpu,InstanceConfiguration.Memory,AutoScalingConfigurationSummary.AutoScalingConfigurationArn,HealthCheckConfiguration.Protocol,HealthCheckConfiguration.Path,HealthCheckConfiguration.Interval,HealthCheckConfiguration.Timeout,HealthCheckConfiguration.HealthyThreshold,HealthCheckConfiguration.UnhealthyThreshold]' \
            --output text)"
          WANTED="$(printf '%s\t%s\t%s\tHTTP\t/api/livez\t5\t4\t1\t3' "$CPU" "$MEMORY" "$SCALING")"
          if [ "$CURRENT" = "$WANTED" ]; then
            echo "Service already runs $CPU CPU, $MEMORY MB, $MIN_INSTANCES to $MAX_INSTANCES instances."
            exit 0
          fi

          INSTANCE="Cpu=$CPU,Memory=$MEMORY"
          ROLE="$(aws apprunner describe-service --service-arn "$ARN" --region "$AWS_REGION" \
            --query 'Service.InstanceConfiguration.InstanceRoleArn' --output text)"
          if [ -n "$ROLE" ] && [ "$ROLE" != "None" ]; then
            INSTANCE="$INSTANCE,InstanceRoleArn=$ROLE"
          fi
          aws apprunner update-service --service-arn "$ARN" --region "$AWS_REGION" \
            --instance-configuration "$INSTANCE" \
            --auto-scaling-configuration-arn "$SCALING" \
            --health-check-configuration Protocol=HTTP,Path=/api/livez,Interval=5,Timeout=4,HealthyThreshold=1,UnhealthyThreshold=3 \
            >/dev/null
          for _ in $(seq 1 40); do
            STATUS="$(aws apprunner describe-service --service-arn "$ARN" \
              --region "$AWS_REGION" --query 'Service.Status' --output text)"
            [ "$STATUS" = "RUNNING" ] && exit 0
            echo "waiting for update: $STATUS"
            sleep 15
          done
          echo "Timed out waiting for the service update."
          exit 1

      - name: Build and push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build --platform linux/amd64 \
            --build-arg BUILD_REVISION="${{ github.sha }}" \
            -f apps/server/Dockerfile \
            -t "$REGISTRY/$ECR_REPO:latest" \
            -t "$REGISTRY/$ECR_REPO:${{ github.sha }}" .
          docker push "$REGISTRY/$ECR_REPO:latest"
          docker push "$REGISTRY/$ECR_REPO:${{ github.sha }}"

      - name: Deploy
        run: |
          ARN="$(aws apprunner list-services --region "$AWS_REGION" \
            --query "ServiceSummaryList[?ServiceName=='$APPRUNNER_SERVICE'].ServiceArn | [0]" \
            --output text)"
          aws apprunner start-deployment --service-arn "$ARN" --region "$AWS_REGION" >/dev/null
          echo "Deploying to $ARN"

      - name: Wait for the deployment to settle
        run: |
          ARN="$(aws apprunner list-services --region "$AWS_REGION" \
            --query "ServiceSummaryList[?ServiceName=='$APPRUNNER_SERVICE'].ServiceArn | [0]" \
            --output text)"
          for _ in $(seq 1 40); do
            STATUS="$(aws apprunner describe-service --service-arn "$ARN" \
              --region "$AWS_REGION" --query 'Service.Status' --output text)"
            echo "status: $STATUS"
            case "$STATUS" in
              RUNNING)
                if curl --fail --silent --show-error --max-time 10 \
                  https://api.anpord.com/api/healthz \
                  | jq --exit-status --arg revision "${{ github.sha }}" \
                    '.ok == true and .revision == $revision' >/dev/null; then
                  exit 0
                fi
                echo "The requested revision is not serving healthy traffic yet."
                ;;
              CREATE_FAILED|DELETE_FAILED) exit 1 ;;
            esac
            sleep 15
          done
          echo "Timed out waiting for the requested revision to serve healthy traffic."
          exit 1
