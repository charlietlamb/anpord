name: Anpord evals
description: Run TypeScript evals on Anpord and gate CI on their results.
inputs:
  api-key:
    description: An Anpord API key with evals read and write access.
    required: true
  working-directory:
    description: Directory containing the evals and an installed anpord dependency.
    default: .
  file:
    description: One eval file, relative to the working directory. Omit to discover suites.
  fail-on:
    description: failures, strict, or never. Defaults to the CLI's failures gate.
  timeout:
    description: Maximum seconds to wait per batch. Uses the CLI default when omitted. Does not cancel the remote batch.
outputs:
  report:
    description: Path to the JSON report, including batch IDs and failures.
    value: ${{ steps.eval.outputs.report }}
runs:
  using: composite
  steps:
    - id: eval
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ANPORD_API_KEY: ${{ inputs.api-key }}
        ANPORD_EVAL_FILE: ${{ inputs.file }}
        ANPORD_EVAL_GATE: ${{ inputs.fail-on }}
        ANPORD_EVAL_TIMEOUT: ${{ inputs.timeout }}
      run: node "$GITHUB_ACTION_PATH/run.mjs"
